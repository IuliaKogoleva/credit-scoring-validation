[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreval"
version = "0.1.0"
description = "Validation and model-risk classification of credit scoring (PD) models on imbalanced data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iulia Kogoleva" }]
keywords = ["credit risk", "model validation", "model risk", "PD", "scorecard", "PR-AUC"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
